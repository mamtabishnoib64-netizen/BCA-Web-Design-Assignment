<!DOCTYPE html>
<html>

<head>

<title>Modern Web Page</title>

<style>

body {
    margin: 0;
    font-family: Arial;
}

header, footer {
    background-color: #333;
    color: white;
    padding: 15px;
    text-align: center;
}

nav {
    background-color: #ddd;
    padding: 10px;
}

main {
    display: flex;
    padding: 20px;
    gap: 20px;
}

section {
    flex: 3;
}

aside {
    flex: 1;
    background-color: #f2f2f2;
    padding: 15px;
}

</style>

</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    Home | About | Contact
</nav>

<main>

<section>
    <h2>Main Content</h2>
    <p>This is the main content of the webpage.</p>
</section>

<aside>
    <h3>Sidebar</h3>
    <p>Additional information</p>
</aside>

</main>

<footer>
    &copy; 2026 My Website
</footer>

</body>
</html>
